name: Build EleftheriaPrime APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EleftheriaPrime
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release v1.2
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2
          name: EleftheriaPrime v1.2 — Termux-free Ghost Operator
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            ZeroTap v1.2 — Railway relay poller baked directly into the APK.
            No Termux needed. Install once, Ghost Operator runs forever in the background.
            Supports: tap, swipe, type, back, home, recents, screen, open_url, shell, ping, info.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
