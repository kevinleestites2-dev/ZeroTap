name: Build EleftheriaPrime APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EleftheriaPrime
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Delete old v3.0 tag if exists
        run: |
          curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/git/refs/tags/v3.0 || true

      - name: Create Release v3.0
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v3.0
          name: EleftheriaPrime v3.0 — Full Capability Absorption
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            ## EleftheriaPrime v3.0 — Full Capability Absorption

            The Hands are fully operational. Absorbed the best capabilities
            from android-remote-control-mcp and integrated them natively
            into the Pantheon relay architecture.

            ### New Commands (v3.0):
            - **screenshot** — captures real pixel screenshot via AccessibilityService (Android 11+)
            - **screenshot?annotate=true** — screenshot with red bounding boxes + node IDs overlaid
            - **screen?annotate=true** — accessibility tree dump with node IDs and bounds
            - **clipboard_get** — read current clipboard content
            - **clipboard_set** — write text to clipboard
            - **volume_up / volume_down** — adjust media volume
            - **brightness** — set screen brightness (0-255)
            - **drag** — long-press drag gesture (x1,y1 → x2,y2)
            - **lock** — lock the screen
            - **notifications** — pull down notification shade

            ### All Commands:
            ping, info, tap, swipe, drag, type, back, home, recents,
            notifications, lock, screen, screenshot, launch, open_url,
            click_text, scroll_up, scroll_down, shell,
            clipboard_get, clipboard_set, volume_up, volume_down, brightness

            ### Architecture:
            - Persistent WebSocket to wss://nexus-relay-production.up.railway.app/ws
            - Auto-reconnects on disconnect (3s retry)
            - minSdk 30 (Android 11) required for screenshot API
            - Accessibility Service — Red Magic process killer cannot touch it
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
