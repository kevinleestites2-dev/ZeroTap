name: Build EleftheriaPrime APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EleftheriaPrime
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: EleftheriaPrime — Latest Build
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            ⚡ EleftheriaPrime — Freedom Engine
            Ghost Operator Control Layer for the Pantheon.
            No Termux. No limits. Install and enable Accessibility Service.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
