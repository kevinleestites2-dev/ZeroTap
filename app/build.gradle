plugins {
    id 'com.android.application'
}

android {
    namespace "com.pantheon.eleftheria"
    compileSdk 34
    defaultConfig {
        applicationId "com.pantheon.eleftheria"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
